name: release
on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    uses: victorfaurschou/minecraft-modding-workflows/.github/workflows/build.yml@main
    secrets: inherit

  release:
    needs: build
    permissions:
      contents: write
      actions: read
    uses: victorfaurschou/minecraft-modding-workflows/.github/workflows/release.yml@main
    with:
      mod_name: faster-boats
      build_run_id: ${{ github.run_id }}
      build_sha: ${{ github.sha }}
      build_branch: ${{ github.ref_name }}
      build_event: ${{ github.event_name }}
      modrinth_loaders: fabric
      modrinth_environment: client_only
      modrinth_minecraft_versions: "1.21.2 1.21.3 1.21.4 1.21.5 1.21.6 1.21.7 1.21.8 1.21.9 1.21.10"
      curseforge_loaders: fabric
      curseforge_minecraft_versions: "1.21.2 1.21.3 1.21.4 1.21.5 1.21.6 1.21.7 1.21.8 1.21.9 1.21.10"
      curseforge_java_versions: "21"
    secrets: inherit
